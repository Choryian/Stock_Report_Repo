<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Journal · Chory &amp; Rochet</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="../assets/style.css?v=2">
<style>
  /* Journal-specific */
  body.locked { background: #0f1419; }
  .lock-screen {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
    background: linear-gradient(180deg, #0f1419 0%, #1a1f2e 100%);
    color: #fff;
    z-index: 100;
  }
  .lock-box {
    width: 100%; max-width: 360px;
    padding: 40px 28px;
    text-align: center;
  }
  .lock-mark {
    width: 56px; height: 56px; margin: 0 auto 16px;
    border-radius: 14px;
    background: rgba(255,255,255,0.08);
    display: flex; align-items: center; justify-content: center;
    font-size: 26px;
  }
  .lock-title { font-size: 22px; font-weight: 700; letter-spacing: -0.3px; margin: 0 0 6px; }
  .lock-sub   { font-size: 13px; color: rgba(255,255,255,0.55); margin: 0 0 28px; }
  .lock-form { display: flex; flex-direction: column; gap: 10px; }
  .lock-form input {
    width: 100%; padding: 12px 14px;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 8px;
    color: #fff;
    font-family: inherit;
    font-size: 14px;
    outline: none;
    transition: all 0.15s ease;
  }
  .lock-form input:focus { border-color: rgba(255,255,255,0.35); background: rgba(255,255,255,0.12); }
  .lock-form button {
    padding: 12px 14px;
    background: #fff; color: #0f1419;
    border: none; border-radius: 8px;
    font-family: inherit; font-weight: 600; font-size: 14px;
    cursor: pointer;
    transition: all 0.15s ease;
  }
  .lock-form button:hover { background: #f0f0f0; }
  .lock-form button:disabled { opacity: 0.5; cursor: wait; }
  .lock-error {
    color: #ff8a8a; font-size: 12px; margin-top: 10px;
    min-height: 18px;
  }
  .shake { animation: shake 0.4s ease; }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-8px); }
    75% { transform: translateX(8px); }
  }

  /* Unlocked view */
  body.unlocked .lock-screen { display: none; }
  .journal-main { padding-bottom: 80px; }
  .journal-hero {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 24px; padding-bottom: 16px;
    border-bottom: 1px solid var(--border);
  }
  .journal-hero h1 { margin: 0; font-size: 28px; letter-spacing: -0.5px; }
  .journal-hero .meta { font-size: 12px; color: var(--text-muted); margin-top: 4px; }
  .lock-btn {
    background: var(--bg-soft); border: 1px solid var(--border);
    padding: 7px 14px; border-radius: 999px; font-size: 12px;
    cursor: pointer; font-family: inherit; color: var(--text-muted);
  }
  .lock-btn:hover { color: var(--text); }

  .entry {
    border-bottom: 1px solid var(--border);
    padding: 28px 0;
  }
  .entry:last-child { border-bottom: none; }
  .entry-date {
    font-size: 12px; color: var(--text-muted);
    font-variant-numeric: tabular-nums;
    letter-spacing: 0.3px;
  }
  .entry-title {
    font-size: 22px; font-weight: 700;
    letter-spacing: -0.4px;
    margin: 4px 0 14px;
    line-height: 1.35;
  }
  .entry-body {
    font-size: 15px; line-height: 1.75; color: #2a2a2a;
  }
  .entry-body p  { margin: 0 0 12px; }
  .entry-body h2 { font-size: 18px; margin: 20px 0 8px; }
  .entry-body h3 { font-size: 16px; margin: 18px 0 6px; }
  .entry-body ul, .entry-body ol { padding-left: 22px; margin: 8px 0 14px; }
  .entry-body li { margin: 4px 0; }
  .entry-body blockquote {
    margin: 10px 0; padding: 4px 16px;
    border-left: 3px solid var(--border-strong);
    color: var(--text-muted);
  }
  .entry-body code {
    background: var(--chip-bg); padding: 2px 6px; border-radius: 3px;
    font-family: 'JetBrains Mono', Consolas, monospace; font-size: 13px;
  }
  .entry-body pre {
    background: #f7f7f7; padding: 14px; border-radius: 6px;
    overflow-x: auto; font-size: 13px;
  }
  .entry-body pre code { background: none; padding: 0; }
  .entry-body hr { border: none; border-top: 1px solid var(--border); margin: 20px 0; }
  .entry-body strong { color: #111; }

  .empty-entries { text-align: center; padding: 80px 24px; color: var(--text-muted); }
</style>

<script async src="https://www.googletagmanager.com/gtag/js?id=G-JN4GMS3HSY"></script>

</head>
<body class="locked">

<!-- Lock screen -->
<section class="lock-screen">
  <div class="lock-box">
    <div class="lock-mark">🔒</div>
    <h1 class="lock-title">Journal</h1>
    <p class="lock-sub">비밀번호를 입력하세요</p>
    <form class="lock-form" id="lockForm" autocomplete="off">
      <input type="password" id="password" placeholder="비밀번호" autocomplete="current-password" autofocus>
      <button type="submit" id="unlockBtn">잠금 해제</button>
      <div class="lock-error" id="lockError"></div>
    </form>
  </div>
</section>

<!-- Unlocked content -->
<header class="site-header">
  <div class="container header-inner">
    <a href="../" class="brand">
      <div class="brand-mark">C&amp;R</div>
      <div class="brand-text">
        <div class="brand-title">Stock Report Repository</div>
        <div class="brand-sub">Chory &amp; Rochet · Private Journal</div>
      </div>
    </a>
    <nav class="site-nav">
      <a href="../">Reports</a>
      <a href="../wine/">Wine</a>
    </nav>
  </div>
</header>

<main class="container journal-main">
  <section class="journal-hero">
    <div>
      <h1>Journal</h1>
      <div class="meta" id="entryCount">—</div>
    </div>
    <button class="lock-btn" id="relockBtn">🔒 잠그기</button>
  </section>
  <section id="entryList"></section>
  <section class="empty-entries" id="emptyEntries" hidden>
    <p>아직 쓴 일지가 없습니다.</p>
    <p style="font-size:12px;margin-top:6px;">PowerShell에서 <code>journal_add.ps1</code>로 첫 일지를 작성하세요.</p>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/marked@13.0.0/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
<script>
(function () {
  const ENVELOPE_URL = 'entries.enc';
  const lockForm   = document.getElementById('lockForm');
  const passInput  = document.getElementById('password');
  const unlockBtn  = document.getElementById('unlockBtn');
  const lockError  = document.getElementById('lockError');
  const relockBtn  = document.getElementById('relockBtn');
  const entryList  = document.getElementById('entryList');
  const entryCount = document.getElementById('entryCount');
  const emptyEntries = document.getElementById('emptyEntries');

  function b64ToBytes(b64) {
    const bin = atob(b64);
    const out = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
    return out;
  }

  async function deriveKey(password, salt, iterations) {
    const enc = new TextEncoder();
    const km = await crypto.subtle.importKey(
      'raw', enc.encode(password), { name: 'PBKDF2' }, false, ['deriveKey']
    );
    return await crypto.subtle.deriveKey(
      { name: 'PBKDF2', salt, iterations, hash: 'SHA-256' },
      km,
      { name: 'AES-GCM', length: 256 },
      false,
      ['decrypt']
    );
  }

  async function decryptEnvelope(password, envelope) {
    const salt = b64ToBytes(envelope.salt);
    const iv   = b64ToBytes(envelope.iv);
    const ct   = b64ToBytes(envelope.ct);
    const key  = await deriveKey(password, salt, envelope.iterations || 200000);
    const plainBuf = await crypto.subtle.decrypt({ name: 'AES-GCM', iv }, key, ct);
    return new TextDecoder().decode(plainBuf);
  }

  function renderEntries(entries) {
    if (!entries || entries.length === 0) {
      entryList.innerHTML = '';
      emptyEntries.hidden = false;
      entryCount.textContent = '0 entries';
      return;
    }
    emptyEntries.hidden = true;
    entries.sort((a, b) => (b.datetime || b.date || '').localeCompare(a.datetime || a.date || ''));
    entryCount.textContent = `${entries.length} ${entries.length === 1 ? 'entry' : 'entries'}`;
    entryList.innerHTML = entries.map(e => {
      const md = e.content || '';
      const html = DOMPurify.sanitize(marked.parse(md));
      const title = (e.title || '제목 없음').replace(/[<>&]/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]));
      const date  = (e.datetime || e.date || '').replace(/[<>]/g, '');
      return `<article class="entry">
        <div class="entry-date">${date}</div>
        <h2 class="entry-title">${title}</h2>
        <div class="entry-body">${html}</div>
      </article>`;
    }).join('');
  }

  async function tryUnlock(password) {
    lockError.textContent = '';
    unlockBtn.disabled = true;
    unlockBtn.textContent = '복호화 중…';
    try {
      const res = await fetch(ENVELOPE_URL, { cache: 'no-store' });
      if (!res.ok) {
        if (res.status === 404) {
          // No entries yet: accept any password and show empty state
          // (will be replaced once first entry is added)
          showUnlocked([]);
          return;
        }
        throw new Error(`fetch failed: ${res.status}`);
      }
      const envelope = await res.json();
      const plaintext = await decryptEnvelope(password, envelope);
      let data;
      try { data = JSON.parse(plaintext); }
      catch { throw new Error('decrypted but not JSON'); }
      showUnlocked(data.entries || []);
    } catch (e) {
      console.warn('Unlock failed:', e.message);
      lockError.textContent = '비밀번호가 틀렸거나 파일이 손상되었습니다.';
      const box = document.querySelector('.lock-box');
      box.classList.remove('shake'); void box.offsetWidth; box.classList.add('shake');
      passInput.select();
    } finally {
      unlockBtn.disabled = false;
      unlockBtn.textContent = '잠금 해제';
    }
  }

  function showUnlocked(entries) {
    document.body.classList.remove('locked');
    document.body.classList.add('unlocked');
    renderEntries(entries);
    passInput.value = '';
  }

  function relock() {
    document.body.classList.remove('unlocked');
    document.body.classList.add('locked');
    entryList.innerHTML = '';
    passInput.focus();
  }

  lockForm.addEventListener('submit', (e) => {
    e.preventDefault();
    const pw = passInput.value;
    if (!pw) return;
    tryUnlock(pw);
  });

  relockBtn.addEventListener('click', relock);

  // Lock on tab hidden for >5 min (auto re-lock)
  let hiddenAt = null;
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) {
      hiddenAt = Date.now();
    } else if (hiddenAt && document.body.classList.contains('unlocked')) {
      if (Date.now() - hiddenAt > 5 * 60 * 1000) relock();
      hiddenAt = null;
    }
  });
})();
</script>
</body>
</html>
