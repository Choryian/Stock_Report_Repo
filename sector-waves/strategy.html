const FALLBACK = "./";  // 틀리면 sector-waves(상위 폴더 index)로

function b64ToBytes(b64) {
  const bin = atob(b64);
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return bytes;
}

async function tryDecrypt(password) {
  const enc = new TextEncoder();
  const salt = b64ToBytes(ENC.salt);
  const iv = b64ToBytes(ENC.iv);
  const ct = b64ToBytes(ENC.ct);
  const keyMaterial = await crypto.subtle.importKey(
    "raw", enc.encode(password), {name:"PBKDF2"}, false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey(
    {name:"PBKDF2", salt:salt, iterations:ENC.iter, hash:"SHA-256"},
    keyMaterial, {name:"AES-GCM", length:256}, false, ["decrypt"]);
  const plainBuf = await crypto.subtle.decrypt({name:"AES-GCM", iv:iv}, key, ct);
  return new TextDecoder().decode(plainBuf);
}

document.getElementById("pwForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const pw = document.getElementById("pw").value;
  const errEl = document.getElementById("err");
  errEl.textContent = "복호화 중…";
  try {
    const html = await tryDecrypt(pw);
    // 복호화 성공 → 전체 문서 교체
    document.open();
    document.write(html);
    document.close();
  } catch (err) {
    // 틀린 비밀번호 → GCM 인증 실패 → sector-waves로 리다이렉트
    errEl.textContent = "✗ 잘못된 비밀번호";
    setTimeout(() => { window.location.href = FALLBACK; }, 700);
  }
});
