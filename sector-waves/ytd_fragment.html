<script>
(function(){
  var SVG_ID='ytd-svg', DATA_ID='ytd-data', STORE_KEY='sectorWaves.dashboard.hidden', DEFAULT_BASE='2026-01-01';
  var dataEl=document.getElementById(DATA_ID);
  if(!dataEl) return;
  var DATA=JSON.parse(dataEl.textContent);
  var DATES=DATA.dates, ORDER=DATA.order, SERIES=DATA.series;
  var W=980,H=480,PL=60,PR=130,PT=30,PB=50,plotW=W-PL-PR,plotH=H-PT-PB;

  function idxForDate(d){ for(var i=0;i<DATES.length;i++){ if(DATES[i]>=d) return i; } return DATES.length-1; }
  function loadHidden(){ try{var s=JSON.parse(localStorage.getItem(STORE_KEY)||'[]');return new Set(Array.isArray(s)?s:[]);}catch(e){return new Set();} }
  function saveHidden(){ try{localStorage.setItem(STORE_KEY,JSON.stringify(Array.from(hidden)));}catch(e){} }
  var hidden=loadHidden();
  var baseIdx=idxForDate(DEFAULT_BASE);

  var SVG_STYLE='<defs><style>'
    +'.grid{stroke:#1e293b;stroke-width:.5}'
    +'.axis-text{fill:#64748b;font-size:10px;font-family:"SF Mono","Consolas",monospace}'
    +'.sec-group{cursor:pointer;transition:opacity .15s}'
    +'.sec-group .legend-bg{fill:transparent}'
    +'.sec-group:hover .legend-bg{fill:#1e293b}'
    +'.sec-group:hover .sec-line{stroke-width:3.2;opacity:1}'
    +'.sec-group.is-index:hover .sec-line{stroke-width:4.8}'
    +'.sec-group:hover .sec-dot{r:4}'
    +'.sec-group.is-index:hover .sec-dot{r:5}'
    +'.sec-group.off{opacity:.18}'
    +'.sec-group.off .sec-line{stroke-dasharray:2 3}'
    +'.sec-line{fill:none;stroke-width:1.6;opacity:.88;pointer-events:none;transition:stroke-width .15s,opacity .15s}'
    +'.is-index .sec-line{stroke-width:2.4;opacity:1}'
    +'.sec-dot{pointer-events:none;transition:r .15s}'
    +'.sec-name{font-size:10.5px;font-weight:600;text-anchor:start;dominant-baseline:middle;pointer-events:none}'
    +'.sec-pct{fill:#cbd5e1;font-size:10px;font-family:"SF Mono","Consolas",monospace;text-anchor:start;dominant-baseline:middle;pointer-events:none}'
    +'.baseline{stroke:#475569;stroke-width:.8;stroke-dasharray:4 3}'
    +'</style></defs>';

  function niceStep(range){ var c=[5,10,20,25,50,100]; for(var i=0;i<c.length;i++){ if(range/c[i]<=8) return c[i]; } return 200; }

  function render(){
    var start=baseIdx, end=DATES.length-1, n=end-start+1;
    var lines=[];
    ORDER.forEach(function(key){
      var s=SERIES[key], cl=s.closes, b=null;
      for(var i=start;i<=end;i++){ if(cl[i]!=null){ b=cl[i]; break; } }
      if(b==null) return;
      var pts=[];
      for(var j=start;j<=end;j++){ var c=cl[j]; if(c==null) continue; pts.push([j-start, c/b*100]); }
      if(pts.length<2) return;
      lines.push({key:key,code:s.code,color:s.color,isIndex:s.isIndex,short:s.short,
                  pts:pts,last:pts[pts.length-1][1],lastX:pts[pts.length-1][0]});
    });

    var ymin=Infinity,ymax=-Infinity;
    lines.forEach(function(l){ l.pts.forEach(function(p){ if(p[1]<ymin)ymin=p[1]; if(p[1]>ymax)ymax=p[1]; }); });
    if(!isFinite(ymin)){ ymin=95; ymax=105; }
    ymin=Math.min(ymin,98); ymax=Math.max(ymax,102);
    var padY=(ymax-ymin)*0.06; ymin-=padY; ymax+=padY;
    var yr=(ymax-ymin)||1;
    function xf(i){ return PL+plotW*i/Math.max(n-1,1); }
    function yf(v){ return PT+plotH*(1-(v-ymin)/yr); }

    var parts=['<svg viewBox="0 0 '+W+' '+H+'" xmlns="http://www.w3.org/2000/svg" '
      +'style="font-family:-apple-system,\'Apple SD Gothic Neo\',sans-serif;background:#0a0e1a">', SVG_STYLE];

    // y축 grid
    var step=niceStep(yr), drew100=false;
    var g=Math.ceil(ymin/step)*step;
    for(; g<=ymax; g+=step){
      var y=yf(g), cls=(g===100)?'baseline':'grid'; if(g===100) drew100=true;
      parts.push('<line x1="'+PL+'" y1="'+y.toFixed(1)+'" x2="'+(PL+plotW)+'" y2="'+y.toFixed(1)+'" class="'+cls+'"/>');
      parts.push('<text x="'+(PL-8)+'" y="'+y.toFixed(1)+'" text-anchor="end" dominant-baseline="middle" class="axis-text">'+g+'</text>');
    }
    if(!drew100 && ymin<=100 && ymax>=100){ var y100=yf(100);
      parts.push('<line x1="'+PL+'" y1="'+y100.toFixed(1)+'" x2="'+(PL+plotW)+'" y2="'+y100.toFixed(1)+'" class="baseline"/>');
      parts.push('<text x="'+(PL-8)+'" y="'+y100.toFixed(1)+'" text-anchor="end" dominant-baseline="middle" class="axis-text">100</text>');
    }

    // x축 월별 표기
    var curM=null;
    for(var i=start;i<=end;i++){
      var mm=DATES[i].slice(5,7);
      if(mm!==curM){ curM=mm; var x=xf(i-start);
        parts.push('<line x1="'+x.toFixed(1)+'" y1="'+PT+'" x2="'+x.toFixed(1)+'" y2="'+(PT+plotH)+'" class="grid"/>');
        parts.push('<text x="'+x.toFixed(1)+'" y="'+(PT+plotH+18)+'" text-anchor="middle" class="axis-text">'+parseInt(mm,10)+'월</text>');
      }
    }

    // 라벨 충돌 회피
    var sorted=lines.slice().sort(function(a,b){ return yf(a.last)-yf(b.last); });
    var placed=[], gap=13, labpos={};
    sorted.forEach(function(l){ var ay=yf(l.last); placed.forEach(function(py){ if(Math.abs(ay-py)<gap) ay=py+gap; }); placed.push(ay); labpos[l.key]=ay; });
    var labelX=PL+plotW+8, labelW=95;

    lines.forEach(function(l){
      var chg=l.last-100, sign=chg>=0?'+':'', ay=labpos[l.key];
      var pathd='M '+l.pts.map(function(p){ return xf(p[0]).toFixed(1)+','+yf(p[1]).toFixed(1); }).join(' L ');
      var lx=xf(l.lastX), ly=yf(l.last);
      var dash=l.isIndex?' stroke-dasharray="6 3"':'';
      var nw=l.isIndex?'700':'600', dr=l.isIndex?3.4:2.6;
      var cls='sec-group'+(l.isIndex?' is-index':'')+(hidden.has(l.code)?' off':'');
      parts.push('<g class="'+cls+'" data-sector="'+l.code+'">'
        +'<path d="'+pathd+'" class="sec-line" stroke="'+l.color+'"'+dash+'/>'
        +'<circle class="sec-dot" cx="'+lx.toFixed(1)+'" cy="'+ly.toFixed(1)+'" r="'+dr+'" fill="'+l.color+'"/>'
        +'<rect class="legend-bg" x="'+(labelX-4).toFixed(1)+'" y="'+(ay-7).toFixed(1)+'" width="'+labelW+'" height="14" rx="2"/>'
        +'<text class="sec-name" x="'+labelX.toFixed(1)+'" y="'+ay.toFixed(1)+'" fill="'+l.color+'" font-weight="'+nw+'">'+l.short+'</text>'
        +'<text class="sec-pct" x="'+(labelX+56).toFixed(1)+'" y="'+ay.toFixed(1)+'">'+sign+chg.toFixed(1)+'%</text>'
        +'</g>');
    });

    var baseDate=DATES[baseIdx], lastDate=DATES[end];
    parts.push('<text x="'+PL+'" y="18" fill="#e2e8f0" font-size="13" font-weight="700">상대 성과 · '+baseDate+' = 100</text>');
    parts.push('<text x="'+(PL+plotW)+'" y="18" fill="#64748b" font-size="10" font-family="SF Mono,Consolas,monospace" text-anchor="end">~ '+lastDate+'</text>');
    parts.push('</svg>');

    var wrap=document.getElementById(SVG_ID);
    if(wrap) wrap.innerHTML=parts.join('');

    var bl=document.getElementById(SVG_ID+'-baselabel');
    if(bl) bl.textContent=baseDate+' = 100';

    var rb=document.getElementById(SVG_ID+'-rank');
    if(rb){
      var rows=lines.slice().sort(function(a,b){ return b.last-a.last; });
      rb.innerHTML=rows.map(function(l){ var chg=l.last-100, cls=chg>=0?'pos':'neg', sign=chg>=0?'+':'';
        return '<tr class="sec-row'+(hidden.has(l.code)?' off':'')+'" data-sector="'+l.code+'">'
          +'<td><span class="dot" style="background:'+l.color+'"></span>'+l.key+'</td>'
          +'<td class="num">'+l.last.toFixed(2)+'</td>'
          +'<td class="num '+cls+'">'+sign+chg.toFixed(2)+'%</td></tr>';
      }).join('');
    }
  }

  function applyHidden(){
    document.querySelectorAll('[data-sector]').forEach(function(el){
      el.classList.toggle('off', hidden.has(el.getAttribute('data-sector')));
    });
  }
  function toggle(code){ if(hidden.has(code)) hidden.delete(code); else hidden.add(code); saveHidden(); applyHidden(); }

  // [data-sector] 위임 클릭 (매트릭스 행 · SVG 그룹 · 순위표 행 공통)
  var scope=document.getElementById(SVG_ID+'-scope') || document;
  scope.addEventListener('click', function(e){
    var el=e.target.closest('[data-sector]'); if(!el) return;
    e.stopPropagation();
    toggle(el.getAttribute('data-sector'));
  });

  function setPreset(kind){
    var last=DATES[DATES.length-1], d;
    if(kind==='YTD'){ d='2026-01-01'; }
    else{
      var days={'1M':30,'3M':91,'6M':182,'1Y':365}[kind]||30;
      var t=new Date(last+'T00:00:00'); t.setDate(t.getDate()-days);
      d=t.toISOString().slice(0,10);
    }
    baseIdx=idxForDate(d);
    var inp=document.getElementById(SVG_ID+'-date'); if(inp) inp.value=DATES[baseIdx];
    setActivePreset(kind);
    render();
  }
  function setActivePreset(kind){
    document.querySelectorAll('[data-ytd-preset][data-ytd-for="'+SVG_ID+'"]').forEach(function(b){
      b.classList.toggle('active', b.getAttribute('data-ytd-preset')===kind);
    });
  }

  function wire(){
    var inp=document.getElementById(SVG_ID+'-date');
    if(inp){ inp.min=DATES[0]; inp.max=DATES[DATES.length-1]; inp.value=DATES[baseIdx];
      inp.addEventListener('change', function(){ if(!inp.value) return; baseIdx=idxForDate(inp.value); inp.value=DATES[baseIdx]; setActivePreset(null); render(); });
    }
    document.querySelectorAll('[data-ytd-preset][data-ytd-for="'+SVG_ID+'"]').forEach(function(b){
      b.addEventListener('click', function(){ setPreset(b.getAttribute('data-ytd-preset')); });
    });
    var sa=document.getElementById(SVG_ID+'-show'), ha=document.getElementById(SVG_ID+'-hide');
    if(sa) sa.addEventListener('click', function(){ hidden.clear(); saveHidden(); applyHidden(); });
    if(ha) ha.addEventListener('click', function(){ ORDER.forEach(function(k){ hidden.add(SERIES[k].code); }); saveHidden(); applyHidden(); });
    setActivePreset('YTD');
    render();
    applyHidden();
